apply plugin: 'com.android.application'

/* ══════════════════════════════════════════════════════════════════════════
   A CHAVE QUE ASSINA O APLICATIVO.

   Ela não está aqui e nunca vai estar: quem a tem publica atualização no seu
   nome, e quem a perde não publica mais nenhuma — a Play Store trata um APK
   assinado por outra chave como outro aplicativo. Então ela mora fora, e este
   arquivo só sabe onde procurar.

       mobile/android/keystore.properties   (não versionado)

   Sem esse arquivo, o build de release sai SEM ASSINATURA. É de propósito:
   quem está só compilando para testar não precisa de chave nenhuma, e um
   keystore de mentira commitado seria pior do que a ausência dele.

   Como criar a sua, uma vez:

       keytool -genkey -v -keystore cineclube.jks -alias cineclube                -keyalg RSA -keysize 2048 -validity 10000

   Ver keystore.properties.example ao lado.
   ══════════════════════════════════════════════════════════════════════════ */
def chaveArquivo = rootProject.file("keystore.properties")
def chave = new Properties()
if (chaveArquivo.exists()) {
    chave.load(new FileInputStream(chaveArquivo))
}
def temChave = chaveArquivo.exists() && chave['storeFile'] != null

android {
    namespace "com.cineclube.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cineclube.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (temChave) {
            release {
                /* O caminho é relativo a mobile/android/ — ou absoluto, que é o
                   normal quando a chave mora fora do projeto. */
                storeFile rootProject.file(chave['storeFile'])
                storePassword chave['storePassword']
                keyAlias chave['keyAlias']
                keyPassword chave['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (temChave) {
                signingConfig signingConfigs.release
            } else {
                /* Dito uma vez, no build, em vez de descoberto na hora de
                   instalar: um APK sem assinatura não instala em aparelho
                   nenhum, e o erro do Android não diz por quê. */
                logger.lifecycle("[cineclube] sem keystore.properties: o release sai SEM assinatura.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    /* ── o WebRTC nativo ──────────────────────────────────────────────────
       Para transmitir a tela deste aparelho. A página não consegue: capturar
       tela é permissão de sistema, e a ponte entre o nativo e a página não
       serve para vídeo — ver screencast/CastEngine.java.

       Este pacote e não `org.webrtc:google-webrtc`: aquele é o oficial, e está
       parado desde 2018 — sem correções, sem os codecs de hardware novos e sem
       suporte a Android recente. */
    implementation "io.getstream:stream-webrtc-android:1.3.10"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
