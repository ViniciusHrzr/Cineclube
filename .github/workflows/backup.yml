/# ══════════════════════════════════════════════════════════════════════════
name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar
        run: npm ci

      - name: Copiar o banco
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CINECLUBE_BACKUP_DIR: ${{ runner.temp }}/backup
        run: npm run backup

      - name: Guardar
        uses: actions/upload-artifact@v4
        with:
          name: cineclube-db-${{ github.run_number }}
          path: ${{ runner.temp }}/backup/*.db
          retention-days: 90
          if-no-files-found: error
