    <!-- ── the room is always the same size ──────────────────────────────────
         This design was drawn against one window: 1536 CSS pixels of width, the
         reference below. Everything in it is stated in pixels, so on a wider
         monitor the same layout used to sit in the middle of a growing field of
         nothing, and on a narrower one it crowded.

         So the interface is scaled to the window instead of laid out against it:
         the zoom is the window's width over the width this was drawn for, which
         makes a poster take the same share of the screen — and the shelf the
         same number of posters — on every monitor. `zoom` and not a transform,
         because the page still has to reflow and stay selectable and scrollable;
         it is the same knob the design already used, now measured rather than
         guessed. The default in the stylesheet stands until this runs.

         Read from window.innerWidth, which is the one width the root's own zoom
         cannot change — documentElement.clientWidth is reported in zoomed units,
         so feeding it back in would chase its own tail.

         The bounds are where proportion stops being the right answer: under
         ~1150px real width the design would be shrinking itself out of
         legibility, and the responsive rules it already carries do a better job;
         over ~3070px it would be scaling past any type size anyone asked for.

         Touch screens keep the stylesheet's own rule (no zoom at all) — the
         property is removed rather than set, so the media query wins. -->
    <script>
      (function () {
        var BASE = 1536, MIN = 0.75, MAX = 2;
        var root = document.documentElement;
        var coarse = window.matchMedia('(hover: none), (pointer: coarse)');
        function fit() {
          if (coarse.matches) return root.style.removeProperty('--ui-zoom');
          var z = Math.min(MAX, Math.max(MIN, window.innerWidth / BASE));
          root.style.setProperty('--ui-zoom', z.toFixed(4));
        }
        fit();
        addEventListener('resize', fit, { passive: true });
        coarse.addEventListener('change', fit);
      })();
    </script>

    <!-- ── is there a GPU behind this page? ───────────────────────────────────
         Everything the room is made of assumes there is: a wall of layers that
         creep forever, a second wall revealed under a moving mask, a light that
         travels by transform. All of that is close to free on a compositor and
         none of it is free on a CPU, and a browser with hardware acceleration
         switched off — by a setting, by a driver the browser distrusts, by a
         machine with no usable GPU — draws every one of those frames in
         software. It is not a rare state: it is one checkbox, and it turned up
         on the first machine outside this project that opened the site.

         So the page asks. WebGL is the only thing a browser will answer
         honestly about: with acceleration off, Chrome hands back SwiftShader
         and says so, and where it hands back nothing at all there is certainly
         no fast path. The context is thrown away immediately — this is a
         question, not a feature.

         The answer becomes an attribute on the root, before the first paint, so
         both the stylesheet and the interface can read it. What they do with it
         is written where they use it: the wall stands still, and the beam stops
         opening a second copy of it. -->
    <script>
      (function () {
        var software = true;
        try {
          var canvas = document.createElement('canvas');
          var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            var dbg = gl.getExtension('WEBGL_debug_renderer_info');
            // No way to ask is not a reason to assume the worst: a browser that
            // hides the renderer for privacy is usually an accelerated one.
            var name = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '') : '';
            software = /swiftshader|llvmpipe|softpipe|software|basic render|microsoft basic/i.test(name);
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          }
        } catch (e) {
          /* asking failed, which is itself an answer */
        }
        if (software) document.documentElement.setAttribute('data-render', 'software');
      })();
    </script>
