# Render Blueprint. Import this repo at dashboard.render.com/blueprints and
# Render reads this file instead of asking a dozen questions.
#
# The repository root is this directory, so Render needs no rootDir.
#
# The client is built here on the machine, not on Render: the free instance has
# 512 MB and a Vite build of ~2000 modules is a coin flip against that ceiling.
# public/ is committed for the same reason, so a deploy is just an install.
services:
  - type: web
    name: cineclube
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: node server.js
    # Cheap endpoint: no database, no TMDB. Just proves the process answers.
    healthCheckPath: /api/catalog/genres
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS in front of the app, so the session cookie must
      # carry Secure. Without this, sign-in silently fails to stick.
      - key: CINECLUBE_HTTPS
        value: "1"
      - key: CINECLUBE_ADMIN
        value: Vinicius
      # sync: false means Render asks for the value and keeps it out of git.
      - key: CINECLUBE_ADMIN_PIN
        sync: false
      - key: TMDB_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
